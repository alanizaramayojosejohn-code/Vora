# Generado originalmente por la CLI de Firebase y ajustado a mano.
# https://github.com/firebase/firebase-tools
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # checkout@v5 y no v4: las acciones sobre Node 20 quedaron obsoletas y
      # desde el 16/06/2026 el runner las fuerza a Node 24.
      - uses: actions/checkout@v5

      # El proyecto pasó de npm a bun (bun.lock, sin package-lock.json): con
      # setup-node + `npm ci` el runner fallaba porque no encuentra ningún
      # lock file soportado. setup-bun trae su propio runtime, así que ya no
      # hace falta fijar la versión de Node aparte.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile
      - run: bun run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VORA_G }}
          channelId: live
          projectId: vora-g
