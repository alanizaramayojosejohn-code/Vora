# Generado originalmente por la CLI de Firebase y ajustado a mano.
# https://github.com/firebase/firebase-tools
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # checkout@v5 y no v4: las acciones sobre Node 20 quedaron obsoletas y
      # desde el 16/06/2026 el runner las fuerza a Node 24.
      - uses: actions/checkout@v5

      # Sin este paso la versión de Node era la que trajera el runner, sin
      # fijar. Angular 21 pide 20.19+, 22.12+ o 24; se fija 22 LTS para que el
      # build no cambie de piso cuando GitHub actualice la imagen.
      # La caché de npm ahorra la mayor parte del tiempo de instalación.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VORA_G }}
          channelId: live
          projectId: vora-g
