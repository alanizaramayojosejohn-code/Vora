<div class="space-y-2.5 select-none">

  <!-- SV gradient panel -->
  <div #svPanel
       class="relative w-full rounded-lg overflow-hidden cursor-crosshair"
       style="height: 110px;"
       [style.background]="svBg()"
       (mousedown)="onSvDown($event)">
    <div class="absolute w-3 h-3 rounded-full border-2 border-white -translate-x-1/2 -translate-y-1/2 pointer-events-none"
         [style.left]="cursorX() + '%'"
         [style.top]="cursorY() + '%'"
         style="box-shadow: 0 0 0 1px rgba(0,0,0,0.35), 0 1px 4px rgba(0,0,0,0.4);">
    </div>
  </div>

  <!-- Hue bar -->
  <div #hueBar
       class="relative h-3 rounded-full cursor-pointer"
       style="background: linear-gradient(to right,
         hsl(0,100%,50%), hsl(30,100%,50%), hsl(60,100%,50%),
         hsl(90,100%,50%), hsl(120,100%,50%), hsl(150,100%,50%),
         hsl(180,100%,50%), hsl(210,100%,50%), hsl(240,100%,50%),
         hsl(270,100%,50%), hsl(300,100%,50%), hsl(330,100%,50%),
         hsl(360,100%,50%))"
       (mousedown)="onHueDown($event)">
    <!-- Thumb -->
    <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-4 h-4 rounded-full border-2 border-white pointer-events-none"
         [style.left]="(h() / 360 * 100) + '%'"
         [style.background]="hueColor()"
         style="box-shadow: 0 0 0 1px rgba(0,0,0,0.2), 0 1px 3px rgba(0,0,0,0.35);">
    </div>
  </div>

  <!-- H / S / B numeric inputs -->
  <div class="grid grid-cols-3 gap-1.5">
    <div>
      <p class="text-[9px] text-foreground-faint uppercase font-semibold tracking-widest mb-0.5">H°</p>
      <input type="number" min="0" max="360" [value]="h()" (change)="onHInput($event)"
             class="w-full px-1.5 py-1 bg-input text-foreground border border-border-subtle
                    rounded text-[11px] font-mono outline-none focus:ring-1 focus:ring-primary/30" />
    </div>
    <div>
      <p class="text-[9px] text-foreground-faint uppercase font-semibold tracking-widest mb-0.5">S%</p>
      <input type="number" min="0" max="100" [value]="s()" (change)="onSInput($event)"
             class="w-full px-1.5 py-1 bg-input text-foreground border border-border-subtle
                    rounded text-[11px] font-mono outline-none focus:ring-1 focus:ring-primary/30" />
    </div>
    <div>
      <p class="text-[9px] text-foreground-faint uppercase font-semibold tracking-widest mb-0.5">B%</p>
      <input type="number" min="0" max="100" [value]="v()" (change)="onVInput($event)"
             class="w-full px-1.5 py-1 bg-input text-foreground border border-border-subtle
                    rounded text-[11px] font-mono outline-none focus:ring-1 focus:ring-primary/30" />
    </div>
  </div>

  <!-- Hex input + swatch -->
  <div class="flex items-center gap-1.5">
    <span class="text-[11px] text-foreground-faint font-mono select-none">#</span>
    <input type="text" [value]="hexDisplay()" (input)="onHexInput($event)"
           maxlength="6" placeholder="000000" spellcheck="false"
           class="flex-1 min-w-0 px-2 py-1 bg-input text-foreground border border-border-subtle
                  rounded text-[11px] font-mono outline-none focus:ring-1 focus:ring-primary/30 uppercase" />
    <div class="w-6 h-6 rounded border border-border-subtle flex-shrink-0"
         [style.background]="currentHex()">
    </div>
  </div>

</div>
