<div class="min-h-screen bg-slate-50 flex flex-col">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-baseline gap-6">
        <div class="flex items-baseline gap-2">
          <h1 class="text-lg font-bold text-slate-900">SaasGym</h1>
          <span class="text-xs font-semibold text-emerald-600 uppercase tracking-wide">{{ audienceLabel }}</span>
        </div>
        <nav class="flex items-center gap-4 text-sm">
          <a routerLink="/admin/home" routerLinkActive="text-emerald-700 font-semibold"
             class="text-slate-600 hover:text-slate-900">Inicio</a>
          <a routerLink="/admin/clients" routerLinkActive="text-emerald-700 font-semibold"
             class="text-slate-600 hover:text-slate-900">Clientes</a>
          <a routerLink="/admin/products" routerLinkActive="text-emerald-700 font-semibold"
             class="text-slate-600 hover:text-slate-900">Productos</a>
          @if (isGym()) {
            <a routerLink="/admin/membership-plans" routerLinkActive="text-emerald-700 font-semibold"
               class="text-slate-600 hover:text-slate-900">Planes</a>
          }
          <a routerLink="/admin/users" routerLinkActive="text-emerald-700 font-semibold"
             class="text-slate-600 hover:text-slate-900">Usuarios</a>
          <a routerLink="/caja/sales" routerLinkActive="text-emerald-700 font-semibold"
             class="text-slate-600 hover:text-slate-900">Ventas</a>
          @if (isGym()) {
            <a routerLink="/caja/attendance" routerLinkActive="text-emerald-700 font-semibold"
               class="text-slate-600 hover:text-slate-900">Asistencia</a>
          }
          <a routerLink="/admin/reports" routerLinkActive="text-emerald-700 font-semibold"
             class="text-slate-600 hover:text-slate-900">Reports</a>
        </nav>
      </div>
      <div class="flex items-center gap-4 text-sm">
        <span class="text-slate-600">
          {{ auth.profile()?.name }}
          <span class="text-slate-400">·</span>
          <span class="text-slate-500">{{ auth.profile()?.role }}</span>
        </span>
        <button (click)="logout()" class="text-slate-600 hover:text-slate-900 font-medium">
          Salir
        </button>
      </div>
    </div>
  </header>
  <main class="flex-1">
    <router-outlet />
  </main>
</div>
