<div class="min-h-screen flex">
  <!-- ============================== Sidebar ============================== -->
  <aside class="w-60 bg-surface backdrop-blur-xl border-r border-border-subtle flex flex-col flex-shrink-0 sticky top-0 h-screen">
    <!-- Brand -->
    <div class="px-5 py-5 flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-lg bg-primary text-primary-fg flex items-center justify-center font-bold text-sm">S</div>
      <span class="font-bold text-foreground tracking-tight">SaasGym</span>
      <span class="text-[10px] font-bold text-foreground-muted uppercase tracking-widest px-1.5 py-0.5 rounded bg-muted border border-border-subtle">{{ audienceLabel }}</span>
    </div>

    <!-- Nav -->
    <nav class="px-3 flex-1 overflow-y-auto pb-4">
      <p class="px-3 pt-3 pb-2 text-[10px] font-semibold uppercase tracking-widest text-foreground-faint">General</p>

      <a routerLink="/admin/home" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         [routerLinkActiveOptions]="{ exact: true }"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12 12 3l9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"/>
        </svg>
        Inicio
      </a>

      <p class="px-3 pt-4 pb-2 text-[10px] font-semibold uppercase tracking-widest text-foreground-faint">Operación</p>

      <a routerLink="/admin/clients" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Socios
      </a>

      <a routerLink="/admin/products" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>
        </svg>
        Productos
      </a>

      @if (isGym()) {
        <a routerLink="/admin/membership-plans" routerLinkActive="bg-primary text-primary-fg shadow-sm"
           class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>
          </svg>
          Planes
        </a>
      }

      <a routerLink="/admin/users" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><circle cx="19" cy="11" r="2"/><path d="M19 8v1"/><path d="M19 13v1"/>
        </svg>
        Personal
      </a>

      <p class="px-3 pt-4 pb-2 text-[10px] font-semibold uppercase tracking-widest text-foreground-faint">Ventas</p>

      <a routerLink="/admin/sales" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
        </svg>
        Ventas
      </a>

      @if (isGym()) {
        <a routerLink="/admin/attendance" routerLinkActive="bg-primary text-primary-fg shadow-sm"
           class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>
          </svg>
          Asistencia
        </a>
      }

      <p class="px-3 pt-4 pb-2 text-[10px] font-semibold uppercase tracking-widest text-foreground-faint">Análisis</p>

      <a routerLink="/admin/reports" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="M7 12v5"/><path d="M12 8v9"/><path d="M17 5v12"/>
        </svg>
        Reportes
      </a>
    </nav>

    <!-- Footer: theme toggle + user profile + logout -->
    <div class="p-3 border-t border-border-subtle space-y-3">
      <div class="flex justify-center">
        <app-theme-mode-toggle />
      </div>
      <div class="flex items-center gap-2 p-2 rounded-lg bg-elevated border border-border-subtle">
        <div class="w-8 h-8 rounded-full bg-primary text-primary-fg flex items-center justify-center text-xs font-bold flex-shrink-0">
          {{ initials() }}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-foreground truncate">{{ auth.profile()?.name }}</p>
          <p class="text-[10px] text-foreground-subtle uppercase tracking-wider">{{ auth.profile()?.role }}</p>
        </div>
        <button (click)="logout()" title="Salir"
                class="text-foreground-muted hover:text-foreground p-1.5 rounded hover:bg-muted transition flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ============================== Main ============================== -->
  <main class="flex-1 min-w-0">
    <router-outlet />
  </main>
</div>
