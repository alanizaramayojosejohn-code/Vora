<div class="min-h-screen flex flex-col lg:flex-row">

  <!-- Mobile topbar -->
  <header class="lg:hidden sticky top-0 z-30 flex items-center gap-3 px-4 h-14 bg-surface border-b border-border-subtle flex-shrink-0">
    <app-menu-toggle [open]="sidebarOpen()" (toggled)="sidebarOpen.set(!sidebarOpen())" />
    <app-brand-logo [small]="true" [badge]="audienceLabel" class="flex items-center gap-2.5 min-w-0" />
  </header>

  <!-- Backdrop -->
  <div class="fixed inset-0 z-40 bg-black/50 lg:hidden transition-opacity duration-300 ease-out"
       [class.opacity-0]="!sidebarOpen()"
       [class.pointer-events-none]="!sidebarOpen()"
       [class.opacity-100]="sidebarOpen()"
       aria-hidden="true"
       (click)="sidebarOpen.set(false)"></div>

  <!-- ============================== Sidebar ============================== -->
  <aside class="fixed inset-y-0 left-0 z-50 w-60 bg-surface backdrop-blur-xl border-r border-border-subtle flex flex-col flex-shrink-0 transition-transform duration-300 ease-in-out lg:sticky lg:inset-auto lg:top-0 lg:h-screen lg:z-auto lg:translate-x-0"
         [class.-translate-x-full]="!sidebarOpen()">

    <!-- Brand -->
    <div class="px-5 py-5 flex items-center gap-2.5 min-w-0">
      <app-brand-logo [badge]="audienceLabel" class="flex items-center gap-2.5 min-w-0" />
    </div>

    <!-- Nav -->
    <div class="flex-1 relative overflow-hidden">
      <nav class="px-3 h-full overflow-y-auto pb-6 scroll-smooth overscroll-contain
                  [&::-webkit-scrollbar]:w-1
                  [&::-webkit-scrollbar-track]:bg-transparent
                  [&::-webkit-scrollbar-thumb]:rounded-full
                  [&::-webkit-scrollbar-thumb]:bg-border-subtle
                  hover:[&::-webkit-scrollbar-thumb]:bg-border">
      <p class="px-3 pt-3 pb-2 text-[10px] font-semibold uppercase tracking-widest text-foreground-faint">General</p>

      <a routerLink="/admin/home" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="sidebarOpen.set(false)"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12 12 3l9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"/>
        </svg>
        Inicio
      </a>

      <p class="px-3 pt-4 pb-2 text-[10px] font-semibold uppercase tracking-widest text-foreground-faint">Operación</p>

      <a routerLink="/admin/clients" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         (click)="sidebarOpen.set(false)"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Clientes
      </a>

      <a routerLink="/admin/products" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         (click)="sidebarOpen.set(false)"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>
        </svg>
        Productos
      </a>

      <a routerLink="/admin/categories" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         (click)="sidebarOpen.set(false)"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
        </svg>
        Categorías
      </a>

      <a routerLink="/admin/tables" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         (click)="sidebarOpen.set(false)"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9h18"/><path d="M5 9V6a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M8 9v10"/><path d="M16 9v10"/>
        </svg>
        Mesas
      </a>

      <a routerLink="/admin/users" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         (click)="sidebarOpen.set(false)"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><circle cx="19" cy="11" r="2"/><path d="M19 8v1"/><path d="M19 13v1"/>
        </svg>
        Usuarios
      </a>

      <ng-container *appIfPlan="'staff'">
      <p class="px-3 pt-4 pb-2 text-[10px] font-semibold uppercase tracking-widest text-foreground-faint">Personal</p>

      <a routerLink="/admin/staff" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         (click)="sidebarOpen.set(false)"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Personal
      </a>
      </ng-container>

      <ng-container *appIfPlan="'purchases'">
      <p class="px-3 pt-4 pb-2 text-[10px] font-semibold uppercase tracking-widest text-foreground-faint">Provisiones</p>

      <a routerLink="/admin/purchases" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         (click)="sidebarOpen.set(false)"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        Provisiones
      </a>
      </ng-container>

      <p class="px-3 pt-4 pb-2 text-[10px] font-semibold uppercase tracking-widest text-foreground-faint">Ventas</p>

      <a routerLink="/admin/sales" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         (click)="sidebarOpen.set(false)"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
        </svg>
        Ventas
      </a>

      <a routerLink="/admin/turno" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         (click)="sidebarOpen.set(false)"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>
        </svg>
        Mi turno de caja
      </a>

      <p class="px-3 pt-4 pb-2 text-[10px] font-semibold uppercase tracking-widest text-foreground-faint">Análisis</p>

      <a routerLink="/admin/reports" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         (click)="sidebarOpen.set(false)"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="M7 12v5"/><path d="M12 8v9"/><path d="M17 5v12"/>
        </svg>
        Reportes
      </a>
      </nav>
      <!-- Fade inferior para indicar scroll -->
      <div class="pointer-events-none absolute bottom-0 inset-x-0 h-8 bg-gradient-to-t from-surface to-transparent"></div>
    </div>

    <!-- Footer: theme toggle + user profile + logout -->
    <div class="p-3 border-t border-border-subtle space-y-3">
      <div class="flex justify-center">
        <app-theme-mode-toggle />
      </div>
      <div class="flex items-center gap-2 p-2 rounded-lg bg-elevated border border-border-subtle">
        <a routerLink="/admin/profile" (click)="sidebarOpen.set(false)"
           class="flex items-center gap-2 flex-1 min-w-0 hover:opacity-75 transition">
          <div class="w-8 h-8 rounded-full bg-primary text-primary-fg flex items-center justify-center text-xs font-bold flex-shrink-0">
            {{ initials() }}
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-foreground truncate">{{ auth.profile()?.name }}</p>
            <p class="text-[10px] text-foreground-subtle uppercase tracking-wider">{{ auth.profile()?.role }}</p>
          </div>
        </a>
        <button (click)="logout()" title="Salir"
                class="text-foreground-muted hover:text-foreground p-1.5 rounded hover:bg-muted transition flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ============================== Main ============================== -->
  <main class="flex-1 min-w-0">
    <app-subscription-status />
    <app-route-view />
  </main>
</div>
