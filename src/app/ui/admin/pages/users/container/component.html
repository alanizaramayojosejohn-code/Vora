<div class="max-w-7xl mx-auto px-6 py-10 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-foreground tracking-tight">Usuarios del negocio</h2>
      <p class="text-foreground-muted text-sm">Cajas y administradores con acceso al panel.</p>
    </div>
    <button appReadonlyDisabled (click)="openCreate()"
            class="px-4 py-2 text-sm font-semibold bg-primary hover:bg-primary/90 text-primary-fg rounded-lg transition shadow-md shadow-primary/20">
      Nuevo colaborador
    </button>
  </div>

  <app-form-modal [open]="showForm()" [submitting]="submitting()"
                  label="Formulario de colaborador" (closed)="closeForm()">
    <app-admin-users-form
      [value]="editing()"
      [submitting]="submitting()"
      [errorMessage]="formError()"
      (submitForm)="handleSubmit($event)"
      (cancel)="closeForm()" />
  </app-form-modal>

  <app-admin-users-list
    [users]="users()"
    [loading]="loading()"
    (edit)="openEdit($event)"
    (remove)="handleDelete($event)" />

  @if (deleting(); as u) {
    <app-confirm-delete
      [open]="true"
      title="¿Eliminar a este colaborador?"
      [description]="deletingError() ?? 'Su profile se borra y no podrá entrar al panel. La cuenta de auth queda en Supabase: para eliminarla por completo hay que hacerlo desde el Dashboard.'"
      confirmLabel="Eliminar usuario"
      [entityLabel]="u.name"
      [entitySublabel]="deletingSublabel()"
      [entityInitials]="deletingInitials()"
      confirmWord="ELIMINAR"
      [submitting]="deletingSubmitting()"
      (confirmed)="confirmDelete()"
      (cancelled)="cancelDelete()" />
  }
</div>
