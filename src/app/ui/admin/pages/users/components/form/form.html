<form [formGroup]="form" (ngSubmit)="onSubmit()"
      class="bg-white border border-slate-200 rounded-xl p-6 space-y-5">
  <div>
    <h3 class="font-semibold text-slate-900">Nuevo usuario</h3>
    <p class="text-sm text-slate-500">
      El usuario debe estar primero creado en Supabase → Authentication → Users.
      Luego pega aquí su UUID para asignarle el rol en tu negocio.
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="md:col-span-2">
      <label for="user_id" class="block text-sm font-medium text-slate-700 mb-1">UUID del usuario (auth.users)</label>
      <input id="user_id" type="text" formControlName="user_id"
             placeholder="00000000-0000-0000-0000-000000000000"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent font-mono text-xs" />
      <p class="text-xs text-slate-500 mt-1">Lo encuentras en el dashboard de Supabase, en Authentication → Users.</p>
    </div>

    <div>
      <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Nombre completo</label>
      <input id="name" type="text" formControlName="name"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent" />
    </div>

    <div>
      <label for="ci" class="block text-sm font-medium text-slate-700 mb-1">CI</label>
      <input id="ci" type="text" formControlName="ci"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent font-mono text-sm" />
    </div>

    <div class="md:col-span-2">
      <label for="role" class="block text-sm font-medium text-slate-700 mb-1">Rol</label>
      <select id="role" formControlName="role"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent bg-white">
        <option value="caja">Caja — opera ventas y asistencia</option>
        <option value="admin">Admin — gestiona todo el negocio</option>
      </select>
    </div>
  </div>

  @if (errorMessage(); as msg) {
    <div class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
      {{ msg }}
    </div>
  }

  <div class="flex justify-end gap-3 pt-2 border-t border-slate-100">
    <button type="button" (click)="cancel.emit()"
            class="px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded-lg transition">
      Cancelar
    </button>
    <button type="submit" [disabled]="form.invalid || submitting()"
            class="px-4 py-2 text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white rounded-lg transition">
      @if (submitting()) {
        Creando…
      } @else {
        Crear usuario
      }
    </button>
  </div>
</form>
