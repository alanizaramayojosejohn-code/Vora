<div class="max-w-7xl mx-auto px-6 py-10 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-foreground tracking-tight">Productos</h2>
      <p class="text-foreground-muted text-sm">Inventario disponible para venta en caja.</p>
    </div>
    @if (showForm()) {
      <button (click)="closeForm()"
              class="px-4 py-2 text-sm font-semibold bg-muted hover:bg-input text-foreground border border-border-subtle rounded-lg transition">
        Cerrar formulario
      </button>
    } @else {
      <button (click)="openCreate()"
              class="px-4 py-2 text-sm font-semibold bg-primary hover:bg-primary/90 text-primary-fg rounded-lg transition shadow-md shadow-primary/20">
        Nuevo producto
      </button>
    }
  </div>

  @if (showForm()) {
    <app-admin-products-form
      [value]="editing()"
      [submitting]="submitting()"
      [errorMessage]="formError()"
      (submitForm)="handleSubmit($event)"
      (cancel)="closeForm()" />
  }

  <app-admin-products-list
    [products]="products()"
    [loading]="loading()"
    (edit)="openEdit($event)"
    (remove)="handleDelete($event)" />

  @if (deleting(); as p) {
    <app-confirm-delete
      [open]="true"
      title="¿Eliminar este producto?"
      [description]="deletingError() ?? 'Se quitará del catálogo y del POS. Las ventas históricas seguirán mostrándolo.'"
      confirmLabel="Eliminar producto"
      [entityLabel]="p.name"
      [entitySublabel]="deletingSublabel()"
      [entityInitials]="deletingInitials()"
      [amount]="deletingPrice()"
      amountLabel="Precio"
      [submitting]="deletingSubmitting()"
      (confirmed)="confirmDelete()"
      (cancelled)="cancelDelete()" />
  }
</div>
