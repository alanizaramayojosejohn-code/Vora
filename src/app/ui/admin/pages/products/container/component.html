<div class="max-w-7xl mx-auto px-6 py-10 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-slate-900">Productos</h2>
      <p class="text-slate-600 text-sm">Inventario disponible para venta en caja.</p>
    </div>
    @if (showForm()) {
      <button (click)="closeForm()"
              class="px-4 py-2 text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition">
        Cerrar formulario
      </button>
    } @else {
      <button (click)="openCreate()"
              class="px-4 py-2 text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition">
        Nuevo producto
      </button>
    }
  </div>

  @if (showForm()) {
    <app-admin-products-form
      [value]="editing()"
      [submitting]="submitting()"
      [errorMessage]="formError()"
      (submitForm)="handleSubmit($event)"
      (cancel)="closeForm()" />
  }

  <app-admin-products-list
    [products]="products()"
    [loading]="loading()"
    (edit)="openEdit($event)"
    (remove)="handleDelete($event)" />
</div>
