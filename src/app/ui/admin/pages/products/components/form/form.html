<form [formGroup]="form" (ngSubmit)="onSubmit()"
      class="bg-white border border-slate-200 rounded-xl p-6 space-y-5">
  <div>
    <h3 class="font-semibold text-slate-900">
      @if (isEdit()) { Editar producto } @else { Nuevo producto }
    </h3>
    <p class="text-sm text-slate-500">
      @if (isEdit()) { Modifica los datos del producto. } @else { Agrega un ítem al inventario del negocio. }
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="md:col-span-2">
      <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
      <input id="name" type="text" formControlName="name"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent" />
    </div>

    <div class="md:col-span-2">
      <label for="description" class="block text-sm font-medium text-slate-700 mb-1">Descripción <span class="text-slate-400">(opcional)</span></label>
      <textarea id="description" rows="2" formControlName="description"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"></textarea>
    </div>

    <div>
      <label for="category" class="block text-sm font-medium text-slate-700 mb-1">Categoría <span class="text-slate-400">(opcional)</span></label>
      <input id="category" type="text" formControlName="category"
             placeholder="bebidas, suplementos, ropa…"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent" />
    </div>

    <div>
      <label for="provider" class="block text-sm font-medium text-slate-700 mb-1">Proveedor <span class="text-slate-400">(opcional)</span></label>
      <input id="provider" type="text" formControlName="provider"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent" />
    </div>

    <div>
      <label for="price" class="block text-sm font-medium text-slate-700 mb-1">Precio</label>
      <input id="price" type="number" min="0" step="0.01" formControlName="price"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent font-mono text-sm" />
    </div>

    <div>
      <label for="cost" class="block text-sm font-medium text-slate-700 mb-1">Costo</label>
      <input id="cost" type="number" min="0" step="0.01" formControlName="cost"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent font-mono text-sm" />
    </div>

    <div>
      <label for="stock" class="block text-sm font-medium text-slate-700 mb-1">
        @if (isEdit()) { Stock } @else { Stock inicial }
      </label>
      <input id="stock" type="number" min="0" step="1" formControlName="stock"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent font-mono text-sm" />
    </div>
  </div>

  @if (errorMessage(); as msg) {
    <div class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
      {{ msg }}
    </div>
  }

  <div class="flex justify-end gap-3 pt-2 border-t border-slate-100">
    <button type="button" (click)="cancel.emit()"
            class="px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded-lg transition">
      Cancelar
    </button>
    <button type="submit" [disabled]="form.invalid || submitting()"
            class="px-4 py-2 text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white rounded-lg transition">
      @if (submitting()) {
        @if (isEdit()) { Guardando… } @else { Creando… }
      } @else {
        @if (isEdit()) { Guardar cambios } @else { Crear producto }
      }
    </button>
  </div>
</form>
