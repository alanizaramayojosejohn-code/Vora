<form [formGroup]="form" (ngSubmit)="onSubmit()"
      class="bg-surface backdrop-blur-xl border border-border-subtle rounded-2xl p-6 space-y-5 shadow-sm">
  <div>
    <h3 class="font-semibold text-foreground">
      @if (isEdit()) { Editar producto } @else { Nuevo producto }
    </h3>
    <p class="text-sm text-foreground-subtle">
      @if (isEdit()) { Modifica los datos del producto. } @else { Agrega un ítem al inventario del negocio. }
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="md:col-span-2">
      <label for="name" class="block text-sm font-medium text-foreground-muted mb-1">Nombre</label>
      <input id="name" type="text" formControlName="name"
             class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary placeholder:text-foreground-faint" />
    </div>

    <div class="md:col-span-2">
      <label for="description" class="block text-sm font-medium text-foreground-muted mb-1">Descripción <span class="text-foreground-faint">(opcional)</span></label>
      <textarea id="description" rows="2" formControlName="description"
                class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary placeholder:text-foreground-faint resize-none"></textarea>
    </div>

    <div>
      <label for="category" class="block text-sm font-medium text-foreground-muted mb-1">Categoría <span class="text-foreground-faint">(opcional)</span></label>
      <input id="category" type="text" formControlName="category"
             placeholder="bebidas, suplementos, ropa…"
             class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary placeholder:text-foreground-faint" />
    </div>

    <div>
      <label for="provider" class="block text-sm font-medium text-foreground-muted mb-1">Proveedor <span class="text-foreground-faint">(opcional)</span></label>
      <input id="provider" type="text" formControlName="provider"
             class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary placeholder:text-foreground-faint" />
    </div>

    <div>
      <label for="price" class="block text-sm font-medium text-foreground-muted mb-1">Precio</label>
      <input id="price" type="number" min="0" step="0.01" formControlName="price"
             class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary font-mono text-sm placeholder:text-foreground-faint" />
    </div>

    <div>
      <label for="cost" class="block text-sm font-medium text-foreground-muted mb-1">Costo</label>
      <input id="cost" type="number" min="0" step="0.01" formControlName="cost"
             class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary font-mono text-sm placeholder:text-foreground-faint" />
    </div>

    <div>
      <label for="stock" class="block text-sm font-medium text-foreground-muted mb-1">
        @if (isEdit()) { Stock } @else { Stock inicial }
      </label>
      <input id="stock" type="number" min="0" step="1" formControlName="stock"
             class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary font-mono text-sm placeholder:text-foreground-faint" />
    </div>
  </div>

  @if (errorMessage(); as msg) {
    <div class="text-sm text-danger bg-danger/10 border border-danger/20 rounded-lg px-3 py-2">
      {{ msg }}
    </div>
  }

  <div class="flex justify-end gap-3 pt-2 border-t border-border-subtle">
    <button type="button" (click)="cancel.emit()"
            class="px-4 py-2 text-sm font-medium text-foreground-muted hover:bg-muted rounded-lg transition">
      Cancelar
    </button>
    <button type="submit" [disabled]="form.invalid || submitting()"
            class="px-4 py-2 text-sm font-semibold bg-primary hover:bg-primary/90 text-primary-fg disabled:bg-muted disabled:text-foreground-faint disabled:cursor-not-allowed rounded-lg transition shadow-md shadow-primary/20 disabled:shadow-none">
      @if (submitting()) {
        @if (isEdit()) { Guardando… } @else { Creando… }
      } @else {
        @if (isEdit()) { Guardar cambios } @else { Crear producto }
      }
    </button>
  </div>
</form>
