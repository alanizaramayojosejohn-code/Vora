<div class="max-w-7xl mx-auto px-6 py-10 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-foreground tracking-tight">Clientes</h2>
      <p class="text-foreground-muted text-sm">Clientes registrados en tu negocio.</p>
    </div>
    <button appReadonlyDisabled (click)="openCreate()"
            class="px-4 py-2 text-sm font-semibold bg-primary hover:bg-primary/90 text-primary-fg rounded-lg transition shadow-md shadow-primary/20">
      Nuevo cliente
    </button>
  </div>

  <app-form-modal [open]="showForm()" [submitting]="submitting()"
                  label="Formulario de cliente" (closed)="closeForm()">
    <app-admin-clients-form
      [value]="editing()"
      [submitting]="submitting()"
      [errorMessage]="formError()"
      (submitForm)="handleSubmit($event)"
      (cancel)="closeForm()" />
  </app-form-modal>

  <app-admin-clients-list
    [clients]="clients()"
    [loading]="loading()"
    (edit)="openEdit($event)"
    (remove)="handleDelete($event)" />

  @if (deleting(); as c) {
    <app-confirm-delete
      [open]="true"
      title="¿Eliminar este cliente?"
      [description]="deletingError() ?? 'Esta acción no se puede deshacer. Si tiene membresías asignadas, la operación fallará.'"
      confirmLabel="Eliminar cliente"
      [entityLabel]="c.name"
      [entitySublabel]="'CI ' + c.ci"
      [entityInitials]="deletingInitials()"
      confirmWord="ELIMINAR"
      [submitting]="deletingSubmitting()"
      (confirmed)="confirmDelete()"
      (cancelled)="cancelDelete()" />
  }
</div>
