<form [formGroup]="form" (ngSubmit)="onSubmit()"
      class="p-6 pr-14 space-y-5">
  <div>
    <h3 class="font-semibold text-foreground">
      @if (isEdit()) { Editar mesa } @else { Nueva mesa }
    </h3>
    <p class="text-sm text-foreground-subtle">
      @if (isEdit()) { Modifica el nombre o el estado de la mesa. } @else { Las mesas activas aparecen al abrir una cuenta en caja. }
    </p>
  </div>

  <div class="space-y-4">
    <div>
      <label for="table-name" class="block text-sm font-medium text-foreground-muted mb-1">Nombre</label>
      <input id="table-name" type="text" formControlName="name"
             placeholder="Mesa 1, Barra, Terraza 2…"
             class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary placeholder:text-foreground-faint" />
    </div>

    <label class="flex items-start gap-3 cursor-pointer">
      <input type="checkbox" formControlName="is_active"
             class="mt-0.5 w-4 h-4 accent-primary cursor-pointer" />
      <span>
        <span class="block text-sm font-medium text-foreground">Mesa activa</span>
        <span class="block text-xs text-foreground-subtle">
          Una mesa inactiva deja de ofrecerse al abrir cuentas, pero conserva su historial.
          No se puede desactivar mientras tenga un pedido pendiente.
        </span>
      </span>
    </label>
  </div>

  @if (errorMessage(); as msg) {
    <div class="text-sm text-danger bg-danger/10 border border-danger/20 rounded-lg px-3 py-2">
      {{ msg }}
    </div>
  }

  <div class="flex justify-end gap-3 pt-2 border-t border-border-subtle">
    <button type="button" (click)="cancel.emit()"
            class="px-4 py-2 text-sm font-medium text-foreground-muted hover:bg-muted rounded-lg transition">
      Cancelar
    </button>
    <button type="submit" [disabled]="form.invalid || submitting()"
            class="px-4 py-2 text-sm font-semibold bg-primary hover:bg-primary/90 text-primary-fg disabled:bg-muted disabled:text-foreground-faint disabled:cursor-not-allowed rounded-lg transition shadow-md shadow-primary/20 disabled:shadow-none">
      @if (submitting()) {
        @if (isEdit()) { Guardando… } @else { Creando… }
      } @else {
        @if (isEdit()) { Guardar cambios } @else { Crear mesa }
      }
    </button>
  </div>
</form>
