<form [formGroup]="form" (ngSubmit)="onSubmit()"
      class="bg-white border border-slate-200 rounded-xl p-6 space-y-5">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div>
      <label for="search" class="block text-sm font-medium text-slate-700 mb-1">Buscar por CI o nombre</label>
      <input id="search" type="text" formControlName="search"
             (input)="onSearch(form.controls.search.value)"
             placeholder="Escribe para filtrar…"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent" />
    </div>

    <div class="md:col-span-2">
      <label for="client_id" class="block text-sm font-medium text-slate-700 mb-1">Socio</label>
      <select id="client_id" formControlName="client_id"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent bg-white">
        <option value="" disabled>Selecciona un socio…</option>
        @for (client of filteredClients(); track client.id) {
          <option [value]="client.id">{{ client.ci }} · {{ client.name }}</option>
        }
      </select>
      @if (filteredClients().length === 0) {
        <p class="text-xs text-slate-500 mt-1">No hay socios que coincidan con tu búsqueda.</p>
      }
    </div>
  </div>

  @if (errorMessage(); as msg) {
    <div class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
      {{ msg }}
    </div>
  }

  @if (successMessage(); as msg) {
    <div class="text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2">
      {{ msg }}
    </div>
  }

  <div class="flex justify-end pt-2 border-t border-slate-100">
    <button type="submit" [disabled]="form.invalid || submitting()"
            class="px-4 py-2 text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white rounded-lg transition">
      @if (submitting()) {
        Registrando…
      } @else {
        Registrar asistencia
      }
    </button>
  </div>
</form>
