<form [formGroup]="form" (ngSubmit)="onSubmit()"
      class="bg-surface backdrop-blur-xl border border-border-subtle rounded-2xl p-6 space-y-5 shadow-sm">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div>
      <label for="search" class="block text-sm font-medium text-foreground-muted mb-1">Buscar por CI o nombre</label>
      <input id="search" type="text" formControlName="search"
             (input)="onSearch(form.controls.search.value)"
             placeholder="Escribe para filtrar…"
             class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary placeholder:text-foreground-faint" />
    </div>

    <div class="md:col-span-2">
      <label for="client_id" class="block text-sm font-medium text-foreground-muted mb-1">Socio</label>
      <select id="client_id" formControlName="client_id"
              class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
        <option value="" disabled>Selecciona un socio…</option>
        @for (client of filteredClients(); track client.id) {
          <option [value]="client.id">{{ client.ci }} · {{ client.name }}</option>
        }
      </select>
      @if (filteredClients().length === 0) {
        <p class="text-xs text-foreground-subtle mt-1">No hay socios que coincidan con tu búsqueda.</p>
      }
    </div>
  </div>

  @if (errorMessage(); as msg) {
    <div class="text-sm text-danger bg-danger/10 border border-danger/20 rounded-lg px-3 py-2">
      {{ msg }}
    </div>
  }

  @if (successMessage(); as msg) {
    <div class="text-sm text-success bg-success/10 border border-success/20 rounded-lg px-3 py-2">
      {{ msg }}
    </div>
  }

  <div class="flex justify-end pt-2 border-t border-border-subtle">
    <button type="submit" [disabled]="form.invalid || submitting()"
            class="px-4 py-2 text-sm font-semibold bg-primary hover:bg-primary/90 text-primary-fg disabled:bg-muted disabled:text-foreground-faint disabled:cursor-not-allowed rounded-lg transition shadow-md shadow-primary/20 disabled:shadow-none">
      @if (submitting()) {
        Registrando…
      } @else {
        Registrar asistencia
      }
    </button>
  </div>
</form>
