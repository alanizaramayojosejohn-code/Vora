<div class="max-w-7xl mx-auto px-6 py-10 space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-foreground tracking-tight">Asistencia</h2>
    <p class="text-foreground-muted text-sm">Registra el ingreso del socio. Si su plan tiene sesiones, se descuenta una.</p>
  </div>

  <app-caja-attendance-form
    [clients]="clients()"
    [submitting]="submitting()"
    [errorMessage]="formError()"
    [successMessage]="successMessage()"
    (registerForClient)="handleRegister($event)" />

  <app-caja-attendance-list [attendance]="attendance()" [loading]="loading()" />
</div>
