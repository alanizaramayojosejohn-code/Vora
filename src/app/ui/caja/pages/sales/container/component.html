<div class="max-w-7xl mx-auto px-6 py-10 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-slate-900">Ventas</h2>
      <p class="text-slate-600 text-sm">
        @if (isGym()) {
          Registra ventas de productos y asigna membresías a socios.
        } @else {
          Registra ventas de productos.
        }
      </p>
    </div>
    <div class="flex gap-2">
      <button (click)="openForm('product')"
              [class.bg-emerald-600]="activeForm() === 'product'"
              [class.text-white]="activeForm() === 'product'"
              [class.bg-white]="activeForm() !== 'product'"
              [class.text-slate-700]="activeForm() !== 'product'"
              [class.border-slate-300]="activeForm() !== 'product'"
              class="px-4 py-2 text-sm font-semibold border border-emerald-600 hover:bg-emerald-700 hover:text-white rounded-lg transition">
        Vender producto
      </button>
      @if (isGym()) {
        <button (click)="openForm('membership')"
                [class.bg-emerald-600]="activeForm() === 'membership'"
                [class.text-white]="activeForm() === 'membership'"
                [class.bg-white]="activeForm() !== 'membership'"
                [class.text-slate-700]="activeForm() !== 'membership'"
                [class.border-slate-300]="activeForm() !== 'membership'"
                class="px-4 py-2 text-sm font-semibold border border-emerald-600 hover:bg-emerald-700 hover:text-white rounded-lg transition">
          Vender membresía
        </button>
      }
    </div>
  </div>

  @if (activeForm() === 'product') {
    <app-caja-sales-product-form
      [products]="products()"
      [clients]="clients()"
      [submitting]="submitting()"
      [errorMessage]="formError()"
      (submitForm)="handleSaleProduct($event)"
      (cancel)="closeForm()" />
  } @else if (activeForm() === 'membership' && isGym()) {
    <app-caja-sales-membership-form
      [clients]="clients()"
      [plans]="plans()"
      [submitting]="submitting()"
      [errorMessage]="formError()"
      (submitForm)="handleSaleMembership($event)"
      (cancel)="closeForm()" />
  }

  <app-caja-sales-list
    [sales]="sales()"
    [loading]="loading()"
    (cancel)="handleCancel($event)" />
</div>
