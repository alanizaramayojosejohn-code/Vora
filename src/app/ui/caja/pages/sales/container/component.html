<div class="max-w-7xl mx-auto px-6 py-6 space-y-5">

  <!-- Header -->
  <div class="flex items-center justify-between gap-4 flex-wrap">
    <div>
      <h2 class="text-2xl font-bold text-foreground tracking-tight">Ventas</h2>
      <p class="text-foreground-muted text-sm">Historial de órdenes registradas.</p>
    </div>
    <button type="button" (click)="goToNew()"
            class="flex items-center gap-2 px-4 py-2 bg-primary text-primary-fg text-sm font-semibold rounded-lg hover:bg-primary/90 transition shadow-sm">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"/><path d="M12 5v14"/>
      </svg>
      Nueva venta
    </button>
  </div>

  <!-- Orders list (paginated) -->
  <app-caja-sales-list
    [sales]="paginatedOrders()"
    [loading]="loading()"
    (cancel)="handleCancel($event)"
    (invoice)="showInvoice($event)" />

  <!-- Pagination -->
  @if (totalPages() > 1) {
    <div class="flex items-center justify-center gap-1 flex-wrap">
      <button type="button" (click)="setPage(page() - 1)" [disabled]="page() === 1"
              class="px-3 py-1.5 text-sm rounded-lg border border-border-subtle bg-elevated hover:bg-muted disabled:opacity-30 disabled:cursor-not-allowed transition text-foreground-muted">
        ‹
      </button>
      @for (p of pageNumbers(); track p) {
        <button type="button" (click)="setPage(p)"
                [class.bg-primary]="page() === p"
                [class.text-primary-fg]="page() === p"
                [class.border-primary]="page() === p"
                [class.bg-elevated]="page() !== p"
                [class.text-foreground-muted]="page() !== p"
                [class.border-border-subtle]="page() !== p"
                class="px-3 py-1.5 text-sm rounded-lg border hover:bg-muted transition min-w-[2.25rem] text-center">
          {{ p }}
        </button>
      }
      <button type="button" (click)="setPage(page() + 1)" [disabled]="page() === totalPages()"
              class="px-3 py-1.5 text-sm rounded-lg border border-border-subtle bg-elevated hover:bg-muted disabled:opacity-30 disabled:cursor-not-allowed transition text-foreground-muted">
        ›
      </button>
    </div>
  }

</div>

<!-- Invoice modal -->
@if (invoiceOrder(); as order) {
  <app-order-invoice [order]="order" (close)="closeInvoice()" />
}

<!-- Cancel modal -->
@if (cancelling(); as order) {
  <app-confirm-delete
    [open]="true"
    title="¿Cancelar esta orden?"
    [description]="cancellingDescription()"
    confirmLabel="Cancelar orden"
    [entityLabel]="cancellingLabel()"
    [entitySublabel]="cancellingSublabel()"
    [entityInitials]="cancellingInitials()"
    [amount]="cancellingAmount()"
    amountLabel="Total"
    [submitting]="cancellingSubmitting()"
    (confirmed)="confirmCancel()"
    (cancelled)="abortCancel()" />
}
