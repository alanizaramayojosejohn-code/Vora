<div class="min-h-screen flex flex-col">
  <header class="bg-surface backdrop-blur-xl border-b border-border-subtle sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-8">
        <div class="flex items-baseline gap-2">
          <h1 class="text-lg font-bold text-foreground tracking-tight">SaasGym</h1>
          <span class="text-[10px] font-bold text-foreground-muted uppercase tracking-widest px-2 py-0.5 rounded bg-muted border border-border-subtle">{{ audienceLabel }}</span>
        </div>
        <nav class="flex items-center gap-1 text-sm">
          <a routerLink="/saas/home" routerLinkActive="bg-primary text-primary-fg shadow-sm"
             [routerLinkActiveOptions]="{ exact: true }"
             class="text-foreground-muted hover:text-foreground hover:bg-muted px-3 py-1.5 rounded-lg transition font-medium">Inicio</a>
          <a routerLink="/saas/businesses" routerLinkActive="bg-primary text-primary-fg shadow-sm"
             class="text-foreground-muted hover:text-foreground hover:bg-muted px-3 py-1.5 rounded-lg transition font-medium">Negocios</a>
        </nav>
      </div>
      <div class="flex items-center gap-4 text-sm">
        <span class="text-foreground-muted">
          {{ auth.profile()?.name }}
          <span class="text-foreground-faint">·</span>
          <span class="text-foreground-subtle">{{ auth.profile()?.role }}</span>
        </span>
        <button (click)="logout()"
                class="text-foreground-muted hover:text-foreground font-medium px-3 py-1.5 rounded-lg hover:bg-muted transition">
          Salir
        </button>
      </div>
    </div>
  </header>
  <main class="flex-1">
    <router-outlet />
  </main>
</div>
