<div class="min-h-screen flex flex-col lg:flex-row">

  <!-- Mobile topbar -->
  <header class="lg:hidden sticky top-0 z-30 flex items-center gap-3 px-4 h-14 bg-surface border-b border-border-subtle flex-shrink-0">
    <button (click)="sidebarOpen.set(!sidebarOpen())"
            class="p-2 rounded-lg hover:bg-muted text-foreground-muted hover:text-foreground transition">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" x2="20" y1="6" y2="6"/>
        <line x1="4" x2="20" y1="12" y2="12"/>
        <line x1="4" x2="20" y1="18" y2="18"/>
      </svg>
    </button>
    <div class="w-7 h-7 rounded-lg bg-primary text-primary-fg flex items-center justify-center font-bold text-xs flex-shrink-0">V</div>
    <span class="font-bold text-foreground tracking-tight">Vora</span>
    <span class="text-[10px] font-bold text-foreground-muted uppercase tracking-widest px-1.5 py-0.5 rounded bg-muted border border-border-subtle">{{ audienceLabel }}</span>
  </header>

  <!-- Backdrop -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-40 bg-black/50 lg:hidden" (click)="sidebarOpen.set(false)"></div>
  }

  <!-- ============================== Sidebar ============================== -->
  <aside class="fixed inset-y-0 left-0 z-50 w-60 bg-surface backdrop-blur-xl border-r border-border-subtle flex flex-col flex-shrink-0 transition-transform duration-300 ease-in-out lg:sticky lg:inset-auto lg:top-0 lg:h-screen lg:z-auto lg:translate-x-0"
         [class.-translate-x-full]="!sidebarOpen()">

    <!-- Brand -->
    <div class="px-5 py-5 flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-lg bg-primary text-primary-fg flex items-center justify-center font-bold text-sm">V</div>
      <span class="font-bold text-foreground tracking-tight">Vora</span>
      <span class="text-[10px] font-bold text-foreground-muted uppercase tracking-widest px-1.5 py-0.5 rounded bg-muted border border-border-subtle">{{ audienceLabel }}</span>
    </div>

    <!-- Nav -->
    <nav class="px-3 flex-1 overflow-y-auto pb-4">
      <p class="px-3 pt-3 pb-2 text-[10px] font-semibold uppercase tracking-widest text-foreground-faint">Plataforma</p>

      <a routerLink="/saas/home" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="sidebarOpen.set(false)"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12 12 3l9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"/>
        </svg>
        Inicio
      </a>

      <a routerLink="/saas/businesses" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         (click)="sidebarOpen.set(false)"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>
        </svg>
        Negocios
      </a>

      <a routerLink="/saas/subscriptions" routerLinkActive="bg-primary text-primary-fg shadow-sm"
         (click)="sidebarOpen.set(false)"
         class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-foreground-muted hover:text-foreground hover:bg-muted rounded-lg transition mb-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>
        </svg>
        Facturación
      </a>
    </nav>

    <!-- Footer: theme toggle + user profile + logout -->
    <div class="p-3 border-t border-border-subtle space-y-3">
      <div class="flex justify-center">
        <app-theme-mode-toggle />
      </div>
      <div class="flex items-center gap-2 p-2 rounded-lg bg-elevated border border-border-subtle">
        <a routerLink="/saas/profile" (click)="sidebarOpen.set(false)"
           class="flex items-center gap-2 flex-1 min-w-0 hover:opacity-75 transition">
          <div class="w-8 h-8 rounded-full bg-primary text-primary-fg flex items-center justify-center text-xs font-bold flex-shrink-0">
            {{ initials() }}
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-foreground truncate">{{ auth.profile()?.name }}</p>
            <p class="text-[10px] text-foreground-subtle uppercase tracking-wider">{{ auth.profile()?.role }}</p>
          </div>
        </a>
        <button (click)="logout()" title="Salir"
                class="text-foreground-muted hover:text-foreground p-1.5 rounded hover:bg-muted transition flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ============================== Main ============================== -->
  <main class="flex-1 min-w-0">
    <router-outlet />
  </main>
</div>
