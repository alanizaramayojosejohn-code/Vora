<div class="max-w-7xl mx-auto px-6 py-10 space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between gap-4 flex-wrap">
    <div>
      <h2 class="text-2xl font-bold text-foreground tracking-tight">Facturación</h2>
      <p class="text-foreground-muted text-sm">Suscripciones, tarifas e historial de cobros por negocio.</p>
    </div>
    @if (selectedItem()) {
      <button (click)="closePayments()"
              class="px-4 py-2 text-sm font-semibold bg-muted hover:bg-input text-foreground border border-border-subtle rounded-lg transition">
        ← Volver a la lista
      </button>
    }
  </div>

  <!-- Configurar suscripción: modal sobre lo que haya detrás. Antes reemplazaba
       la lista entera, así que configurar una suscripción hacía perder de vista
       el resto de los negocios. -->
  @if (configuringItem(); as item) {
    <app-form-modal [open]="true" [submitting]="configSubmitting()"
                    label="Configurar suscripción" (closed)="closeConfigure()">
      <app-saas-subscription-form
        [business]="item.business"
        [subscription]="item.subscription"
        [submitting]="configSubmitting()"
        [errorMessage]="configError()"
        (submitForm)="handleConfigure($event)"
        (cancel)="closeConfigure()" />
    </app-form-modal>
  }

  <!-- Vista: panel de pagos -->
  @if (selectedItem(); as item) {
    <app-form-modal [open]="showPaymentForm()" [submitting]="paymentSubmitting()"
                    label="Registrar pago" (closed)="showPaymentForm.set(false)">
      <app-saas-subscription-payment-form
        [item]="item"
        [submitting]="paymentSubmitting()"
        [errorMessage]="paymentError()"
        (submitForm)="handlePayment($event)"
        (cancel)="showPaymentForm.set(false)" />
    </app-form-modal>

    <app-saas-subscription-payments-history
      [item]="item"
      [payments]="payments()"
      [loading]="paymentsLoading()"
      (close)="closePayments()"
      (addPayment)="showPaymentForm.set(true)"
      (deletePayment)="handleDeletePayment($event)" />

    @if (deletingPayment(); as p) {
      <app-confirm-delete
        [open]="true"
        title="¿Eliminar este pago?"
        [description]="deletingPaymentError() ?? 'Esta acción no se puede deshacer. El vencimiento NO se revierte automáticamente.'"
        confirmLabel="Eliminar pago"
        [entityLabel]="item.business.name"
        [entitySublabel]="p.period_label + ' · ' + (p.paid_at | date: 'dd/MM/yyyy')"
        confirmWord="ELIMINAR"
        [submitting]="deletingPaymentSubmitting()"
        (confirmed)="confirmDeletePayment()"
        (cancelled)="cancelDeletePayment()" />
    }
  }

  <!-- Vista: lista principal -->
  @else {
    <app-saas-subscriptions-list
      [items]="items()"
      [loading]="loading()"
      (select)="openPayments($event)"
      (configure)="openConfigure($event)" />
  }

</div>
