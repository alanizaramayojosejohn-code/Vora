<form [formGroup]="form" (ngSubmit)="onSubmit()"
      class="bg-surface backdrop-blur-xl border border-border-subtle rounded-2xl p-6 space-y-6 shadow-sm">

  <div>
    <h3 class="font-semibold text-foreground">
      @if (isEdit()) { Editar suscripción } @else { Activar suscripción }
    </h3>
    <p class="text-sm text-foreground-subtle">{{ business().name }}</p>
  </div>

  <!-- Selector de plan -->
  <div class="space-y-3">
    <p class="text-xs font-semibold text-foreground-muted uppercase tracking-wider">Plan</p>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      @for (plan of planOptions; track plan) {
        <button type="button" (click)="selectPlan(plan)"
                [class.border-primary]="selectedPlan() === plan"
                [class.ring-2]="selectedPlan() === plan"
                [class.ring-primary\/30]="selectedPlan() === plan"
                [class.border-border-subtle]="selectedPlan() !== plan"
                class="text-left rounded-xl border p-3 transition hover:border-foreground-muted bg-elevated space-y-1">
          <div class="flex items-start justify-between gap-1">
            <p class="font-semibold text-foreground text-sm">{{ PLAN_LABELS[plan] }}</p>
            @if (selectedPlan() === plan) {
              <div class="w-4 h-4 rounded-full bg-primary text-primary-fg flex items-center justify-center text-[9px] font-bold flex-shrink-0">✓</div>
            }
          </div>
          @if (plan !== 'custom') {
            <p class="text-base font-bold text-foreground">{{ PLAN_FEES[plan] }} <span class="text-xs font-normal text-foreground-muted">Bs/mes</span></p>
          } @else {
            <p class="text-xs text-foreground-muted">Monto libre</p>
          }
          <p class="text-[11px] text-foreground-subtle leading-tight">{{ PLAN_DESCRIPTIONS[plan] }}</p>
        </button>
      }
    </div>
  </div>

  <!-- Tarifa + fechas -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div>
      <label for="monthly_fee" class="block text-sm font-medium text-foreground-muted mb-1">
        Tarifa mensual <span class="text-foreground-faint">(Bs)</span>
      </label>
      <input id="monthly_fee" type="number" formControlName="monthly_fee" min="1" step="10"
             [readOnly]="selectedPlan() !== 'custom'"
             [class.bg-muted]="selectedPlan() !== 'custom'"
             [class.cursor-not-allowed]="selectedPlan() !== 'custom'"
             class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
      @if (selectedPlan() !== 'custom') {
        <p class="text-[11px] text-foreground-faint mt-1">Fijado por el plan seleccionado</p>
      }
    </div>

    <div>
      <label for="start_date" class="block text-sm font-medium text-foreground-muted mb-1">Fecha de contratación</label>
      <input id="start_date" type="date" formControlName="start_date"
             class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
    </div>

    <div>
      <label for="end_date" class="block text-sm font-medium text-foreground-muted mb-1">Fecha de vencimiento</label>
      <input id="end_date" type="date" formControlName="end_date"
             class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
    </div>
  </div>

  @if (errorMessage(); as msg) {
    <div class="text-sm text-danger bg-danger/10 border border-danger/20 rounded-lg px-3 py-2">{{ msg }}</div>
  }

  <div class="flex justify-end gap-3 pt-2 border-t border-border-subtle">
    <button type="button" (click)="cancel.emit()"
            class="px-4 py-2 text-sm font-medium text-foreground-muted hover:bg-muted rounded-lg transition">
      Cancelar
    </button>
    <button type="submit" [disabled]="form.invalid || submitting()"
            class="px-4 py-2 text-sm font-semibold bg-primary hover:bg-primary/90 text-primary-fg disabled:bg-muted disabled:text-foreground-faint disabled:cursor-not-allowed rounded-lg transition shadow-md shadow-primary/20 disabled:shadow-none">
      @if (submitting()) { Guardando… } @else {
        @if (isEdit()) { Guardar cambios } @else { Activar suscripción }
      }
    </button>
  </div>
</form>
