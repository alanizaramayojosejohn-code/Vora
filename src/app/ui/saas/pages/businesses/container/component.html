<div class="max-w-7xl mx-auto px-6 py-10 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-foreground tracking-tight">Negocios</h2>
      <p class="text-foreground-muted text-sm">Cada negocio es un tenant aislado. Tipos: POS o gimnasio.</p>
    </div>
    <button (click)="openCreate()"
            class="px-4 py-2 text-sm font-semibold bg-primary hover:bg-primary/90 text-primary-fg rounded-lg transition shadow-md shadow-primary/20">
      Nuevo negocio
    </button>
  </div>

  <app-form-modal [open]="showForm()" [submitting]="submitting()"
                  label="Formulario de negocio" widthClass="max-w-3xl" (closed)="closeForm()">
    <app-saas-businesses-form
      [value]="editing()"
      [subscription]="editingSubscription()"
      [submitting]="submitting()"
      [errorMessage]="formError()"
      (submitForm)="handleSubmit($event)"
      (cancel)="closeForm()" />
  </app-form-modal>

  <app-saas-businesses-list
    [businesses]="businesses()"
    [loading]="loading()"
    (edit)="openEdit($event)"
    (remove)="handleDelete($event)" />

  @if (deleting(); as b) {
    <app-confirm-delete
      [open]="true"
      title="¿Eliminar este negocio?"
      [description]="deletingError() ?? 'Borra TODO en cascada: usuarios, clientes, productos, planes, ventas, membresías y asistencias. No se puede deshacer.'"
      confirmLabel="Eliminar negocio"
      [entityLabel]="b.name"
      [entitySublabel]="deletingSublabel()"
      [entityInitials]="deletingInitials()"
      confirmWord="ELIMINAR"
      [submitting]="deletingSubmitting()"
      (confirmed)="confirmDelete()"
      (cancelled)="cancelDelete()" />
  }
</div>
