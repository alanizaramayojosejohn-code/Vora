<h2 class="text-xl font-semibold text-foreground mb-1">Iniciar sesión</h2>
<p class="text-sm text-foreground-subtle mb-6">Ingresa con tu cuenta para continuar.</p>

@if (auth.unauthorizedEmail(); as email) {
  <div class="text-sm text-warning bg-warning/10 border border-warning/20 rounded-lg px-3 py-2 mb-4">
    La cuenta <strong class="text-foreground">{{ email }}</strong> no está autorizada en SaasCafes.
    Contacta al administrador.
  </div>
}

<button
  type="button"
  (click)="loginWithGoogle()"
  [disabled]="loading()"
  class="w-full flex items-center justify-center gap-3 border border-border-subtle bg-elevated text-foreground-muted font-medium py-2.5 rounded-lg transition hover:bg-muted disabled:opacity-50 disabled:cursor-not-allowed"
>
  <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
    <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
    <path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
    <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
    <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
  </svg>
  Continuar con Google
</button>

<div class="flex items-center gap-3 my-5 text-xs text-foreground-faint">
  <div class="flex-1 h-px bg-border-subtle"></div>
  <span>o continúa con email</span>
  <div class="flex-1 h-px bg-border-subtle"></div>
</div>

<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
  <div>
    <label for="email" class="block text-sm font-medium text-foreground-muted mb-1">Email</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="email"
      class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none transition focus:ring-2 focus:ring-primary/30 focus:border-primary placeholder:text-foreground-faint"
    />
  </div>

  <div>
    <label for="password" class="block text-sm font-medium text-foreground-muted mb-1">Contraseña</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      class="w-full px-3 py-2 bg-input text-foreground border border-border-subtle rounded-lg outline-none transition focus:ring-2 focus:ring-primary/30 focus:border-primary placeholder:text-foreground-faint"
    />
  </div>

  @if (error(); as msg) {
    <div class="text-sm text-danger bg-danger/10 border border-danger/20 rounded-lg px-3 py-2">
      {{ msg }}
    </div>
  }

  <button
    type="submit"
    [disabled]="form.invalid || loading()"
    class="mt-2 bg-primary hover:bg-primary/90 text-primary-fg disabled:bg-muted disabled:text-foreground-faint disabled:cursor-not-allowed font-semibold py-2.5 rounded-lg transition shadow-lg shadow-primary/20"
  >
    @if (loading()) {
      Entrando…
    } @else {
      Entrar
    }
  </button>
</form>
