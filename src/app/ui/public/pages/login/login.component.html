<h2 class="text-2xl font-semibold mb-8 text-white/[0.90]" style="letter-spacing:-0.01em">
  Iniciar sesión
</h2>

@if (auth.unauthorizedEmail(); as email) {
  <div class="text-sm rounded-xl px-4 py-3 mb-5"
       style="background:rgba(234,179,8,0.07); border:1px solid rgba(234,179,8,0.16); color:rgba(253,224,71,0.85)">
    La cuenta <strong class="text-white/80">{{ email }}</strong>
    no está autorizada. Contacta al administrador.
  </div>
}

<!-- Google -->
<button
  type="button"
  (click)="loginWithGoogle()"
  [disabled]="loading()"
  class="w-full flex items-center justify-center gap-2.5 py-3 rounded-xl text-sm font-medium
         bg-white/5 hover:bg-white/[0.08] active:bg-white/[0.06]
         border border-white/[0.09] text-white/75 hover:text-white/90
         transition-colors duration-150
         disabled:opacity-40 disabled:cursor-not-allowed"
>
  <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
    <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
    <path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
    <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
    <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
  </svg>
  Continuar con Google
</button>

<!-- Divider -->
<div class="flex items-center gap-3 my-6">
  <div class="flex-1 h-px bg-white/[0.07]"></div>
  <span class="text-[11px] font-medium text-white/[0.28]">o con email</span>
  <div class="flex-1 h-px bg-white/[0.07]"></div>
</div>

<!-- Form -->
<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">

  <div class="flex flex-col gap-1.5">
    <label for="email" class="text-sm font-medium text-white/[0.46]">Email</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="tu@correo.com"
      class="w-full px-4 py-3 rounded-xl text-sm
             bg-white/[0.04] border border-white/[0.09] text-white/[0.85]
             placeholder:text-white/25
             outline-none transition-all duration-150
             focus:bg-white/[0.06] focus:border-violet-500/50 focus:ring-2 focus:ring-violet-600/20"
    />
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="password" class="text-sm font-medium text-white/[0.46]">Contraseña</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      placeholder="••••••••"
      class="w-full px-4 py-3 rounded-xl text-sm
             bg-white/[0.04] border border-white/[0.09] text-white/[0.85]
             placeholder:text-white/25
             outline-none transition-all duration-150
             focus:bg-white/[0.06] focus:border-violet-500/50 focus:ring-2 focus:ring-violet-600/20"
    />
  </div>

  @if (error(); as msg) {
    <div class="text-sm rounded-xl px-4 py-3"
         style="background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.18); color:rgba(252,165,165,0.90)">
      {{ msg }}
    </div>
  }

  <button
    type="submit"
    [disabled]="form.invalid || loading()"
    class="mt-1 w-full py-3 rounded-xl text-sm font-semibold
           bg-violet-800 hover:bg-violet-700 active:bg-violet-900 text-white
           shadow-lg shadow-violet-900/40
           disabled:bg-white/[0.06] disabled:text-white/[0.22] disabled:shadow-none disabled:cursor-not-allowed
           transition-colors duration-150"
  >
    @if (loading()) { Entrando… } @else { Entrar }
  </button>

</form>
