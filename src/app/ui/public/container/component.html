<!--
  Wrapper de pantallas publicas (login). El bg-base ya viene del body
  via styles.css; aca solo posicionamos el card centrado con el efecto
  glass del pencil.
-->
<div class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
  <!-- Orbes decorativos para que el backdrop-blur del card tenga algo que difuminar.
       En el preset monochrome son apenas perceptibles; en presets coloridos
       (ocean/forest/etc.) le dan un toque ambient sin saturar. -->
  <div aria-hidden="true"
       class="absolute -top-40 -left-40 w-[40rem] h-[40rem] rounded-full bg-primary/10 blur-3xl"></div>
  <div aria-hidden="true"
       class="absolute -bottom-40 -right-40 w-[44rem] h-[44rem] rounded-full bg-accent/10 blur-3xl"></div>

  <div class="w-full max-w-md relative">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center mb-3">
        @if (theme.resolvedMode() === 'light') {
          <img src="img/svima_white.webp" alt="SaasGym" class="h-14 w-auto">
        } @else {
          <img src="img/vima_black.webp" alt="SaasGym" class="h-14 w-auto">
        }
      </div>
      <p class="text-sm text-foreground-subtle">Gestión de negocios POS y GYM</p>
    </div>

    <div class="bg-surface backdrop-blur-xl rounded-2xl border border-border-subtle shadow-2xl shadow-black/10 p-8">
      <router-outlet />
    </div>
  </div>
</div>
